services:
  - type: web
    name: team-rotation-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: PORT
        value: 10000
    disk:
      name: cache-storage
      mountPath: /opt/render/project/src
      sizeGB: 1
